# Make dodongo run away from holes
0e/67d9/: |
  /ifdef d2_boss_in_d3
  jp nz, dodongo_reset_movement_in_hole
  /endif

0e//dodongo_reset_movement_in_hole: |
  /ifdef d2_boss_in_d3
  sub $48
  cp $04
  jp nc,$68eb ; dodongo_resetMovement
  jp $67dc ; @in_spikes
  /endif

