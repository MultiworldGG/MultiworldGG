09//makuTreeItem3: |
  ld hl,locations.makuTree3Essences
  ld c,$20
  jp makuTreeItem

09//makuTreeItem5: |
  ld hl,locations.makuTree5Essences
  ld c,$40
  jp makuTreeItem

09//makuTreeItem7: |
  ld hl,locations.makuTree7Essences
  ld c,$80
  jp makuTreeItem

09//makuTreeItem: |
  ld e,$44 ; Interaction.state
  ld a,(de)
  or a
  jp nz,@state1
  
  push hl
  ; data about the 3 items is stored in 23b, since it's a maku screen with nothing in it
  ld a,$01
  ld b,$3b
  call getRoomFlags
  and c
  pop bc
  jp nz,interactionDelete
  ld a,$01
  ld (de),a ; increase state
  call $6391 ; misc1_spawnTreasureBC
  ld l,$77 ; Interaction.var37
  ld (hl),d
  ld e,l
  ld a,h
  ld (de),a
  ret

  @state1:
  ld e,$77 ; Interaction.var37
  ld a,(de) ; get the h of the linked treasure 
  ld h,a
  ld l,e
  ld a,(hl)
  cp d
  ret z
  
  ; Treasure was collected since last frame
  ld a,$01
  ld b,$3b
  call getRoomFlags
  or c
  ld (hl),a
  jp interactionDelete

