
17//closedWarpTable: /include closedWarpTable

17//underwaterRoomWarpTable: /include underwaterWarpTable

17//symmetryRoomWarpTable: |
    dwbe $0009
    dwbe $0003
    dwbe $000A
    dwbe $000C
    dwbe $000D
    
    db $ff

17//weirdBehaviorWarpTable: |
    dw $2203, resetPatchOnEnteringHouse
    dw $1000, checkMoblinFort
    db $ff

17//resetPatchOnEnteringHouse: |
  ld hl,$cfd2
  xor a
  ldi (hl),a # patchDownstairs
  ld (hl),a # wonMinigame
  ret

17//checkMoblinFort: |
  ld hl,$c709
  ld a,(hl)
  bit 0,a
  ret nz
  ld a, $1 
  ld (wWarpCheck),a #warp failed
  ld a, $5a
  ld (wWarpTextLow),a #No text
  ld a, $27
  ld (wWarpTextHigh),a
  ret 


# Attempting to enter underwater warp without mermaid suit will cancel the warp and instead
# cause Link to drown. (Could happen with dungeon entrance randomization.)
# Credit to Stewmat
17//drownLinkOnUnderwaterWarp: |
  ld a,TREASURE_MERMAID_SUIT
  call checkTreasureObtained
  ret c
  ; Is leading to underwater map. Replace the warp tile with a deep water tile.
  ld h,$cf
  ld a,($FF8D)
  ld l,a
  ld (hl),$fc # TILEINDEX_DEEP_WATER
  ld a, $1 
  ld (wWarpCheck),a #warp failed
  ld a, $FF
  ld (wWarpTextLow),a #No text
  ret 

17//checkSymmetryFlag: |
  ld a,GLOBALFLAG_TUNI_NUT_PLACED
  call checkGlobalFlag
  ret nz
  ; Is leading to non-saved symetry city. Replace the warp tile with a lava tile.
  ld h,$cf
  ld a,($FF8D)
  ld l,a
  ld (hl),$61 # TILEINDEX_DUNGEON_LAVA_1
  ld a, $1
  ld (wWarpCheck),a
  ld a, $FF
  ld (wWarpTextLow),a  #No text
  ret

17//checkTreasureObtained_shuffle: |
  cp TREASURE_BOMBS
  jp nz, checkTreasureObtained
  call checkTreasureObtained # check bombs
  ret c
  ld a, TREASURE_BOMBCHUS # and bombchus
  jp checkTreasureObtained

17//checkEntranceFlag: |
  ;---------------
  ; Setup
  ldi a,(hl)
  ld d,a #Flag Address upper
  ldi a,(hl)
  ld e,a #Flag Address lower
  ldi a,(hl)
  ld b,a #Flag mask
  ldi a,(hl)
  ld c,a #Unlock item
  ;---------------
  ; Checks if flag set
  ld a,(de)
  and b
  jr nz,@end ; already open
  ;---------------
  ; Depending of the option, check item, force open, or don't warp
  dwbe option.closedEntranceForceOperation
  ;---------------
  ; Check item received
  ld a,c
  cp $00
  jr z,@dontWarp
  call checkTreasureObtained_shuffle
  jr nc,@dontWarp
  ;---------------
  ; Results force open
  @forceOpen:
  ld a,(de)
  or b
  ld (de),a
  jr @end
  ;---------------
  ; Results don't warp
  @dontWarp:
  ld a,(wWarpCheck)
  cp $0
  jr nz,@end
  ld a, $1
  ld (wWarpCheck),a
  ldi a,(hl)
  ld (wWarpTextLow),a
  ldi a,(hl)
  ld (wWarpTextHigh),a
  @end:
  ret

17//checkDungeonWarp_body: |
  ld a,(wWarpDestGroup)
  and $7f
  ld b,a
  ld a,(wWarpDestRoom)
  ld c,a

  # ---- Check the flag table ----
  ld hl, closedWarpTable
  @loopStart:
  ldi a,(hl)
  cp $ff 
  jp z,@loop2Init ; Not a warp that we are interested in, jump to the second part
  cp b ; Only checking the group number here
  ldi a,(hl)
  jr nz,@loopEnd
  cp c ; Actually checking the "warp dest index" not the room index
  jr nz,@loopEnd
  jp checkEntranceFlag
  @loopEnd:
  ld a,$6
  rst 10 ; addAToHL
  jr @loopStart

  # ---- Check the symmetry table ----
  @loop2Init:
  ld hl, symmetryRoomWarpTable
  @loop2Start:
  ldi a,(hl)
  cp $ff 
  jr z, @loop3Init ; Not a warp that we are interested in, check 3rd part
  cp b ; Only checking the group number here
  ldi a,(hl)
  jr nz,@loop2Start
  cp c ; Actually checking the "warp dest index" not the room index
  jr nz,@loop2Start
  jp checkSymmetryFlag

  # ---- Check the underwater table ----
  @loop3Init:
  ld hl, underwaterRoomWarpTable
  @loop3Start:
  ldi a,(hl)
  cp $ff 
  jr z, @loop4Init ; Not a warp that we are interested in, check 4st part
  cp b ; Only checking the group number here
  ldi a,(hl)
  jr nz,@loop3Start
  cp c ; Actually checking the "warp dest index" not the room index
  jr nz,@loop3Start
  jp drownLinkOnUnderwaterWarp
  
  # ---- Check weird behavior table table ----
  @loop4Init:
  ld hl, weirdBehaviorWarpTable
  @loop4Start:
  ldi a,(hl)
  cp $ff 
  ret z ; Not a warp that we are interested in, go back and call initiateWarp
  cp b ; Only checking the group number here
  ldi a,(hl)
  jr nz,@loop4Next
  cp c ; Actually checking the "warp dest index" not the room index
  jr nz,@loop4Next
  ldi a,(hl)
  ld h,(hl)
  ld l,a
  jp (hl)
  @loop4Next:
  ld a,$2
  rst 10
  jr @loop4Start

01//checkDungeonWarp_neck: |
  ld e,$17
  ld hl,checkDungeonWarp_body
  call interBankCall
  ld a,(wWarpCheck) 
  cp $1
  jp nz,$6163 # Warp confirmed (initiateWarp)
  # ---- abort potential transition ----
  ld a,$01
  ld (wScrollMode),a
  ld a,$02
  ld (wScreenTransitionState),a # transition state forced to 2
  xor a
  ld (wScreenTransitionState2),a
  ld (wScreenTransitionState3),a
  ld (wDisableLinkCollisionsAndMenu),a
  # ---- abort transition ----
  jp $619f   # Warp aborted (noWarpInitiated)

01//checkDungeonWarp_head : |
  ld ($cc49),a
  jp checkDungeonWarp_neck

01/6160/ : jp checkDungeonWarp_head
01/61cf/ : jp checkDungeonWarp_neck

01//resetWarpCheck : |
  ld a,(wWarpCheck)
  cp $0
  ld a,$0
  ld (wWarpCheck),a
  jr nz,@failedToWarp
  ld a,(wFailedToWarpLastFrame)
  cp $0
  jr z,@end
  sub $1
  ld (wFailedToWarpLastFrame),a
  jr nz,@end
  ld a,(wWarpTextLow)
  cp $ff
  jr z,@end
  ld b,a
  ld a,(wWarpTextHigh)
  ld c,a
  call showText
  @end:
  ld a,($cc5c) # removed line
  ret
  @failedToWarp:
  ld a,$3
  ld (wFailedToWarpLastFrame),a
  jr @end


01/4105/: call resetWarpCheck


# prevent surfacing from underwater without the mermaid suit. this is only
# relevant for the sea of no return if entrances are unrandomized.
05//checkPreventSurface: |
    ld a,(wDisableScreenTransitions)
    or a
    ret nz
    ld a,($c6a3) # byte in wObtainedTreasureFlags
    and $04
    cp $04
    ret
05/516c/: |
  call checkPreventSurface
  nop
