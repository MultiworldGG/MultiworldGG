[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypine"
version = "0.1.0"
description = "Client side implementation of the PINE protocol for PCSX2"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["pypine*"]

[tool.setuptools.package-data]
pypine = ["py.typed"]
